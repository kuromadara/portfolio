# Pulls new Polarsteps trips/photos, mirrors photos to Sanity and commits
# content/travel.json (+ content/rewind.json) when they changed — that commit triggers the Vercel deploy.
# Needs the repo secret SANITY_WRITE_TOKEN (Settings → Secrets and variables → Actions).
name: Sync travel data

on:
  schedule:
    - cron: '30 1 1 1,4,7,10 *' # every 3 months: 1 Jan, Apr, Jul, Oct at 07:00 IST
  workflow_dispatch: # "Run workflow" button in the Actions tab — run any time

permissions:
  contents: write

concurrency:
  group: sync-travel
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run sync:travel
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: qw7500aq
          NEXT_PUBLIC_SANITY_DATASET: projects

      - name: Commit snapshot if it changed
        run: |
          if git diff --quiet -- content/travel.json content/rewind.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add content/travel.json content/rewind.json
          git commit -m "chore: sync travel data from Polarsteps"
          git push
